name: Verify PixelPress
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:processing
      - run: npm run build
      - run: npm test
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
